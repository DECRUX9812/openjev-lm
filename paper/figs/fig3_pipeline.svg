<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
<title>open-Jev: how a posting becomes a typed judgment</title>
<desc>Two local paths. Top: LM arm, Qwen2.5-0.5B plus a 2,162,688 parameter LoRA adapter, constrained decoding into typed JSON. Bottom: classifier arm, frozen bge-small-en-v1.5 with 12-seed MLP heads, 6 ms and 3 MB per posting.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3b3b3"/></marker></defs><rect x="0" y="0" width="1200" height="520" fill="#ffffff"/><text x="64" y="50" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="23" fill="#111111" font-weight="600">open-Jev: how a posting becomes a typed judgment</text><text x="64" y="77" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="13.5" fill="#6b6b6b">one posting in, a typed judgment out — no network, no GPU, no per-call cost</text><rect x="64.0" y="113.0" width="9" height="9" rx="1" fill="#0a7f5a"/><text x="82.0" y="122" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="700" letter-spacing="0.4">LM arm</text><text x="1136.0" y="122" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end">trained locally: 400 steps · 89.3 min · CPU-only</text><rect x="64.0" y="136.0" width="192.0" height="80.0" rx="8" fill="#f6f6f6" stroke="#e3e3e3" stroke-width="1.1"/><text x="160.0" y="181.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#6b6b6b" font-weight="600" text-anchor="middle">posting</text><rect x="284.0" y="136.0" width="192.0" height="80.0" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1"/><text x="380.0" y="173.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#111111" font-weight="500" text-anchor="middle">7-question prompt</text><text x="380.0" y="195.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">bucket · 5 booleans · fit 0-4</text><line x1="262.0" y1="176.0" x2="280.0" y2="176.0" stroke="#b3b3b3" stroke-width="1.4" marker-end="url(#arw)"/><rect x="504.0" y="136.0" width="192.0" height="80.0" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1"/><text x="600.0" y="173.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#111111" font-weight="500" text-anchor="middle">Qwen2.5-0.5B + LoRA</text><text x="600.0" y="195.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">r=16 · 2,162,688 params</text><line x1="482.0" y1="176.0" x2="500.0" y2="176.0" stroke="#b3b3b3" stroke-width="1.4" marker-end="url(#arw)"/><rect x="724.0" y="136.0" width="192.0" height="80.0" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1"/><text x="820.0" y="173.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#111111" font-weight="500" text-anchor="middle">constrained decoding</text><text x="820.0" y="195.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">argmax over allowed labels</text><line x1="702.0" y1="176.0" x2="720.0" y2="176.0" stroke="#b3b3b3" stroke-width="1.4" marker-end="url(#arw)"/><rect x="944.0" y="136.0" width="192.0" height="80.0" rx="8" fill="#ffffff" stroke="#0a7f5a" stroke-width="1.4"/><text x="1040.0" y="173.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#0a7f5a" font-weight="600" text-anchor="middle">typed JSON</text><text x="1040.0" y="195.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">with per-field confidences</text><line x1="922.0" y1="176.0" x2="940.0" y2="176.0" stroke="#b3b3b3" stroke-width="1.4" marker-end="url(#arw)"/><rect x="64.0" y="277.0" width="9" height="9" rx="1" fill="#0a7f5a"/><text x="82.0" y="286" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="700" letter-spacing="0.4">classifier arm</text><text x="1136.0" y="286" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end">deterministic · 12 seeds · published under MIT</text><rect x="64.0" y="300.0" width="247.0" height="80.0" rx="8" fill="#f6f6f6" stroke="#e3e3e3" stroke-width="1.1"/><text x="187.5" y="345.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#6b6b6b" font-weight="600" text-anchor="middle">posting</text><rect x="339.0" y="300.0" width="247.0" height="80.0" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1"/><text x="462.5" y="337.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#111111" font-weight="500" text-anchor="middle">frozen bge-small-en-v1.5</text><text x="462.5" y="359.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">BAAI encoder · weights untouched</text><line x1="317.0" y1="340.0" x2="335.0" y2="340.0" stroke="#b3b3b3" stroke-width="1.4" marker-end="url(#arw)"/><rect x="614.0" y="300.0" width="247.0" height="80.0" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1"/><text x="737.5" y="337.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#111111" font-weight="500" text-anchor="middle">12-seed MLP heads</text><text x="737.5" y="359.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">over frozen embeddings</text><line x1="592.0" y1="340.0" x2="610.0" y2="340.0" stroke="#b3b3b3" stroke-width="1.4" marker-end="url(#arw)"/><rect x="889.0" y="300.0" width="247.0" height="80.0" rx="8" fill="#ffffff" stroke="#0a7f5a" stroke-width="1.4"/><text x="1012.5" y="337.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#0a7f5a" font-weight="600" text-anchor="middle">6 ms / 3 MB</text><text x="1012.5" y="359.0" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">per posting · on CPU</text><line x1="867.0" y1="340.0" x2="885.0" y2="340.0" stroke="#b3b3b3" stroke-width="1.4" marker-end="url(#arw)"/><line x1="64.0" y1="430" x2="1136.0" y2="430" stroke="#ededed" stroke-width="1"/><text x="600" y="464" font-family="Inter, Lato, 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">both trained on Jev's own API answers · both run offline on CPU · $0/call</text></svg>
