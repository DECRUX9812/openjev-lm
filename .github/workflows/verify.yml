name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-derive every headline number from the published receipts
        run: python3 verify/score.py --self-test
      - name: jevgraphic gate invariants (refused numbers never render)
        run: python3 -m unittest discover -s jevgraphic/tests
